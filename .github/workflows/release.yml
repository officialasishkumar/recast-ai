name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/recast-ai

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      notes:   ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose release notes
        id: notes
        run: |
          previous=$(git tag --sort=-creatordate | grep '^v' | head -n 2 | tail -n 1 || echo "")
          if [ -n "$previous" ]; then
            range="$previous..HEAD"
          else
            range="HEAD"
          fi
          {
            echo "notes<<EOF"
            echo "## Recast AI ${{ steps.tag.outputs.version }}"
            echo
            echo "### Changes"
            git log --no-merges --pretty='- %s (%h, @%an)' "$range"
            echo
            echo "### Contributors"
            git log --pretty='%an' "$range" | sort -u | sed 's/^/- /'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: docker/api-gateway.Dockerfile
          - service: upload-service
            dockerfile: docker/upload-service.Dockerfile
          - service: mux-service
            dockerfile: docker/mux-service.Dockerfile
          - service: delivery-service
            dockerfile: docker/delivery-service.Dockerfile
          - service: video-analyzer
            dockerfile: docker/video-analyzer.Dockerfile
          - service: tts-service
            dockerfile: docker/tts-service.Dockerfile
          - service: web
            dockerfile: docker/web.Dockerfile
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            cosign sign --yes "$tag@${{ steps.push.outputs.digest }}"
          done

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [changelog, build-and-push]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.changelog.outputs.version }}
          name: Recast AI ${{ needs.changelog.outputs.version }}
          body: ${{ needs.changelog.outputs.notes }}
          generate_release_notes: false
          prerelease: ${{ contains(needs.changelog.outputs.version, '-rc') || contains(needs.changelog.outputs.version, '-beta') }}
