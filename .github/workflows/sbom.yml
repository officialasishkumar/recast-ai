name: SBOM

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate SBOM (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: repo
            scan: dir:.
          - target: go-modules
            scan: file:./go.mod
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-${{ matrix.target }}.spdx.json

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-${{ matrix.target }}.cdx.json

      - name: Scan SBOM for vulnerabilities
        uses: anchore/scan-action@v5
        with:
          sbom: sbom-${{ matrix.target }}.spdx.json
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.target }}
          path: |
            sbom-${{ matrix.target }}.spdx.json
            sbom-${{ matrix.target }}.cdx.json
          retention-days: 90

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-${{ matrix.target }}.spdx.json
            sbom-${{ matrix.target }}.cdx.json
