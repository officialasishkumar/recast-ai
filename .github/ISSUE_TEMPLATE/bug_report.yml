name: Bug report
description: Report something that does not work as expected.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much as you can so we can reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I upload a 10-minute video, the analyzer never reaches the synthesize stage.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Step-by-step instructions to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.5.2 or commit sha
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - docker-compose (local)
        - kubernetes
        - other
