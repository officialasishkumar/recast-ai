version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - nilerr
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    staticcheck:
      checks:
        - all
        # Drop the QF (quick-fix) family which is style-only.
        - -QF1001
        - -QF1003
        - -QF1008
        # ST1000: package comment requirement is style-only.
        - -ST1000
        # ST1003: identifier naming style suggestions.
        - -ST1003
  exclusions:
    paths:
      - web/node_modules

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - web/node_modules

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
