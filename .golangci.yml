run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gofmt
    - goimports
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - whitespace

linters-settings:
  gocritic:
    enabled-tags: [performance, style, opinionated]
    disabled-checks:
      - hugeParam
      - rangeValCopy
  gosec:
    excludes:
      - G104  # unhandled errors are flagged elsewhere
      - G404  # we use math/rand for non-crypto purposes
  revive:
    severity: warning
    rules:
      - name: unused-parameter
        disabled: true
      - name: var-naming
      - name: error-return
      - name: error-strings
      - name: receiver-naming
      - name: indent-error-flow

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - prealloc
        - unparam
    - path: cmd/
      linters:
        - revive
