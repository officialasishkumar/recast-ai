global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: pager
      group_wait: 10s
      repeat_interval: 1h
    - matchers: [severity="warning"]
      receiver: chat

receivers:
  - name: default
    webhook_configs:
      - url: http://localhost:5001/default
        send_resolved: true
  - name: pager
    webhook_configs:
      - url: http://localhost:5001/pager
        send_resolved: true
  - name: chat
    webhook_configs:
      - url: http://localhost:5001/chat
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, service]
