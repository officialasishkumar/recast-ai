groups:
  - name: recast-pipeline
    interval: 30s
    rules:
      - alert: HighJobFailureRate
        expr: |
          (
            sum(rate(jobs_failed_total[5m]))
            /
            clamp_min(sum(rate(jobs_submitted_total[5m])), 0.001)
          ) > 0.10
        for: 10m
        labels:
          severity: warning
          team: pipeline
        annotations:
          summary: "Job failure rate above 10%"
          description: "{{ $value | humanizePercentage }} of jobs are failing over the last 5 minutes."

      - alert: PipelineStageStalled
        expr: histogram_quantile(0.95, sum by (le, stage) (rate(stage_duration_seconds_bucket[10m]))) > 600
        for: 15m
        labels:
          severity: warning
          team: pipeline
        annotations:
          summary: "Pipeline stage {{ $labels.stage }} p95 > 10 minutes"
          description: "Stage {{ $labels.stage }} has p95 duration {{ $value }}s."

      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} ({{ $labels.instance }}) is down"
          description: "Prometheus has not scraped {{ $labels.job }} for 2 minutes."

      - alert: HighHTTPErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum by (service) (rate(http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} 5xx ratio > 5%"
          description: "{{ $labels.service }} is returning {{ $value | humanizePercentage }} 5xx responses."

      - alert: RabbitMQQueueBacklog
        expr: rabbitmq_queue_messages_ready > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} backlog > 1000"
          description: "{{ $labels.queue }} has {{ $value }} ready messages."

      - alert: RabbitMQDLQGrowing
        expr: increase(rabbitmq_queue_messages{queue=~".*\\.dlq"}[15m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Dead-letter queue {{ $labels.queue }} is growing"
          description: "Messages are being dead-lettered into {{ $labels.queue }}."

  - name: recast-resources
    interval: 30s
    rules:
      - alert: HighContainerCPU
        expr: |
          sum by (container_label_com_docker_compose_service) (
            rate(container_cpu_usage_seconds_total{container_label_com_docker_compose_service!=""}[5m])
          ) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container_label_com_docker_compose_service }} CPU > 85%"

      - alert: HighContainerMemory
        expr: |
          (
            container_memory_working_set_bytes{container_label_com_docker_compose_service!=""}
            / clamp_min(container_spec_memory_limit_bytes{container_label_com_docker_compose_service!=""}, 1)
          ) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container_label_com_docker_compose_service }} memory > 90%"
